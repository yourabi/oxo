[package]
name = "oxo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Oxo server binary: 'Puma in Rust'. Wires the safe-Rust edge to the config-selected Rack handler (supervised by default; embedded behind a feature)."

[features]
default = []
# Build the in-process embedded handler. Transitively turns on oxo-embedded's
# `ruby` feature (which links libruby). Requires a Ruby ABI-matched toolchain.
embedded = ["dep:oxo-embedded", "oxo-embedded/ruby"]

[dependencies]
oxo-core.workspace = true
oxo-edge.workspace = true
oxo-embedded = { workspace = true, optional = true }
tokio.workspace = true
