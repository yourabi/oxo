[package]
name = "oxo-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Oxo's standalone Magnus worker (Linux and macOS): strict one-shot HTTP/1.1 over Unix-domain sockets."

[dependencies]
oxo-core.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# `rb-sys` exposes `rb_protect` for the main thread's interruptible park.
magnus = { version = "0.8", features = ["embed", "rb-sys"] }
libc = "0.2"
