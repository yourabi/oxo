[advisories]
version = 2
yanked = "deny"
unused-ignored-advisory = "deny"
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2024-0437", reason = "protobuf 2.28.0 is pulled only through pinned pingora-core 0.8.1 -> prometheus 0.13.4. Oxo does not expose protobuf parsing on its request, worker, ACME, TLS, or protocol surfaces; accepted until a reviewed Pingora/prometheus bump or a supply-chain re-audit." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  # webpki-root-certs, reached only under the `acme` feature via
  # instant-acme -> hyper-rustls -> rustls-platform-verifier. CDLA-Permissive-2.0 is
  # the Community Data License Agreement, permissive variant -- the license Mozilla's
  # CA root bundle ships under; it covers that root DATA, not code, and carries no
  # copyleft or attribution obligation on the binary. Surfaced when the cargo audit
  # fix let `cargo deny` run for the first time; the dependency itself predates it.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git sources: the static-serving engine + Pingora adapter (crenel, crenel-pingora)
# now come from crates.io like everything else, so nothing needs a git allowlist.
allow-git = []
