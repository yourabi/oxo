name: ci

on:
  push:
  pull_request:

jobs:
  # Cross-platform tests + the fmt/clippy/doc gates. Ruby (+ rack) is installed
  # because the shim worker and direct worker smoke spawn real Ruby code.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install rack -v "~> 3.0"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # The embedded handler links libruby. On Linux the system Ruby + Rust 1.96.0
  # toolchain share an ABI, so the embedded feature is runtime-smoked here. The
  # default (non-embedded) build links no Ruby.
  embedded-linux:
    name: embedded runtime smoke (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install rack -v "~> 3.0"
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: cargo test -p oxo --features embedded embedded_handler_serves_trivial_rack_app

  supply-chain:
    name: supply chain advisories (linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: resolve full Rust feature graph
        run: cargo tree -p oxo-pingora-edge --features tls-rustls,acme --duplicates
      - name: cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2024-0437
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
